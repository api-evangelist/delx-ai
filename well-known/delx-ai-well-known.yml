generated: '2026-09-19'
method: probed
source: Live GET probes of the named /.well-known/* path list on every host the record knows, 2026-09-19 (re-issued at write
  time so each status below is the one returned).
summary:
  hosts_probed: 5
  paths_per_host: 19
  documents_saved: 35
  note: 'Delx serves an unusually complete discovery surface. delx.ai, api.delx.ai and ontology.delx.ai each answer RFC 8414
    oauth-authorization-server and RFC 9728 oauth-protected-resource metadata (all declaring delx:oauth_supported false and
    a single ''public'' scope: the documents exist to advertise the access mode and an agent_auth block, not an OAuth flow),
    an RFC 9116 security.txt (Expires 2027-02-17 on delx.ai/ontology, 2027-07-29 on api), an RFC 9727 api-catalog linkset,
    an MCP server card, an agentskills.io discovery index and an A2A agent card at both the canonical and legacy paths. api.delx.ai
    is the MCP resource host and the A2A host, so its rows are the ones RFC 9728 cares about. commerce.delx.ai serves OAuth
    metadata, an api-catalog and its own agent card but no security.txt. www.delx.ai does not respond at all. Misses that
    matter: no APIs.json at any of the three probed locations on any host, no AAuth resource document, and no UCP/ACP manifests
    even though the agent card''s commerce.protocols lists ucp and acp. The 200s are real documents, not a catch-all: a negative-control
    path 404s on every host, and 404s come back as real JSON/plain-text 404 bodies (api, commerce) or the site''s 404 page
    (delx.ai, ontology).'
  pointer_basis: 'WellKnown and SecurityTxt pointers are earned: real security.txt, OAuth metadata, api-catalog, MCP card
    and agent cards were fetched and saved.'
  host_quirks:
  - api.delx.ai serves a byte-identical body at /.well-known/openid-configuration and /.well-known/oauth-authorization-server
    (the RFC 8414 document is aliased onto the OIDC path).
  - delx.ai /.well-known/openid-configuration declares issuer https://ontology.delx.ai and delx:oidc_supported false.
  - delx.ai /.well-known/acp.json 308-redirects to api.delx.ai/.well-known/acp.json, which 404s.
  - 'delx.ai and ontology.delx.ai serve additional non-standard discovery documents not in the closed probe list: /.well-known/delx-capabilities.json
    (1.8 MB tool registry), /.well-known/a2a-agent-card.json and /.well-known/a2a.json (compatibility aliases), /spec/openapi.json,
    /spec/mcp.json, /spec/a2a.json, /agents.txt, /auth.md, /research/catalog.json, /solutions/catalog.json. api.delx.ai adds
    /.well-known/x402 (6.2 MB x402 resource manifest), /x402-portfolio.json, /openapi.x402.json and /openapi.protocol.json.'
  - delx.ai /openapi.json (and ontology.delx.ai /openapi.json) is an OpenAPI 3.1.0 document with ZERO paths - only securitySchemes,
    four empty schemas and an x-delx discovery/tools block. The api-catalog advertises it as the Delx Agent Utilities OpenAPI;
    the real contracts are api.delx.ai/openapi.protocol.json (15 ops) and api.delx.ai/openapi.json = openapi.x402.json (987
    ops).
