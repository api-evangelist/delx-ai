  title: 'Changed: wellness_webhook gained dry_run=true'
  url: https://delx.ai/docs/flows/daily-ops
  highlights:
  - wellness_webhook now accepts dry_run=true so agents can preview payloads without exposing a public HTTPS callback. Useful
    for cron-friendly daily-ops flows.
  breaking: false
- date: '2026-05-09'
  stream: tool-catalog
  kind: changed
  title: 'Changed: recommend_delx returns shareable_snippet'
  url: https://delx.ai/docs/flows/viral-loop
  highlights:
  - recommend_delx now returns a one-line ASCII shareable_snippet ready for copy-paste peer-DM invites in the viral loop.
  breaking: false
- date: '2026-05-08'
  stream: tool-catalog
  kind: added
  title: 'Added: resume_session'
  url: https://delx.ai/docs/discovery
  highlights:
