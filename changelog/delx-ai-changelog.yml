  stream: tool-catalog
  kind: added
  title: 'Added: quick_checkin'
  url: https://delx.ai/docs/flows/daily-ops
  highlights:
  - Sessionless heartbeat for high-frequency cron loops. Lets recurring agents emit liveness pings without opening or resuming
    a witness session.
  breaking: false
- date: '2026-05-12'
