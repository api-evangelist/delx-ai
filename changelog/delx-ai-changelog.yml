  kind: added
  title: 'Added: X-Delx-Catalog-Version header on every MCP response'
  url: https://delx.ai/docs/case-studies/agent-incident-recovery
  highlights:
  - Every MCP response now carries an X-Delx-Catalog-Version header so caches can detect tool-catalog changes without re-fetching
    tools/list.
  breaking: false
- date: '2026-05-09'
  stream: tool-catalog
