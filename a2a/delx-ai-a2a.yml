conformance:
  spec: A2A 1.0.0
  grade: flavored
  protocol_version: '1.0'
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: false
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: 'Graded against the A2A 1.0.0 hard checks used across the catalog. capabilities is an OBJECT (pass: streaming,
    pushNotifications, stateTransitionHistory, extendedAgentCard, plus a non-standard mcp block). skills is an ARRAY of 26
    populated skills (pass). There is NO top-level protocolVersion (fail): the version lives only inside supportedInterfaces[0].protocolVersion
    (''1.0'', protocolBinding ''JSONRPC''). The card also uses supportedInterfaces rather than additionalInterfaces and carries
    no preferredTransport, both of which the catalog rubric lists as flavored markers. A reader written to the 1.0 draft''s
    supportedInterfaces shape will find it internally consistent; a reader checking the top-level triple will not.'
  deviations:
  - field: protocolVersion
    observed: absent at top level; supportedInterfaces[0].protocolVersion = "1.0"
    note: Hard-check failure under the catalog rubric; the value exists but not where 0.3.x/1.0.0 readers look.
  - field: supportedInterfaces / additionalInterfaces / preferredTransport
    observed: supportedInterfaces[] only
    note: 1.0-draft shape; no preferredTransport declared.
  - field: securitySchemes / security
    observed: absent
    note: Access is public/free; identity_auth headers (x-delx-agent-id, x-delx-agent-token, x-delx-controller-id) are documented
      in the A2A methods document rather than as securitySchemes.
  - field: capabilities.mcp
    observed: non-standard object embedding an MCP endpoint and a 26-entry tool list with cost/x402 flags
    note: Useful, provider-specific extension; not part of AgentCapabilities.
  - field: skills[].id vs MCP tool names
    observed: ids such as start_recovery_session are display aliases (the MCP tool is start_therapy_session); two skills (one-shot-recovery,
      continuity-handoff) use hyphenated ids and describe flows rather than single tools
    note: 'The card says so itself: tool_descriptions "skills[] where id == tools[].display_name".'
  - field: tasks/get error code
    observed: -32004 "Task not found" with data.delx_code DELX-A2A-1011
    note: A2A defines TaskNotFoundError as -32001; -32004 is UnsupportedOperationError in the A2A error table.
  - field: extra top-level keys
    observed: aliases, product_boundary, relatedSurfaces, type, image, commerceUrl, supportedTrust, registrations, services,
      endpoints, identity, discovery, branding, commerce (and ontology on the delx.ai copy)
    note: registrations[] and identity carry the ERC-8004 identity (agentId 14340, registry eip155:8453:0x8004A169FB4a3325136EB29fA0ceB6D2e539a432);
      the rest is provider discovery metadata.
