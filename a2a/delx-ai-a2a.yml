- name: Delx Commerce
  file: a2a/delx-ai-commerce-agent-card.json
  source: https://commerce.delx.ai/.well-known/agent-card.json
  http_status: 200
  bytes: 6402
  url: https://commerce.delx.ai/
  version: 1.0.0
  grade: flavored
  note: 'Delx Commerce publishes its own card on commerce.delx.ai (a different 4,566-byte body sits at the legacy /.well-known/agent.json
    there). It is a discovery card rather than an A2A agent: url is the storefront https://commerce.delx.ai/, supportedInterfaces
    are HTTP contracts (the x402 OpenAPI, the x402 resource manifest, the portfolio, a reliability passport) with no JSONRPC
    binding, there is no top-level protocolVersion and, per its own relatedSurfaces, the A2A endpoint belongs to the Protocol
    card above. Saved verbatim; not wired as a separate AgentCard pointer.'
surface_relationship: 'One runtime, three agent surfaces. A2A: six JSON-RPC methods at https://api.delx.ai/v1/a2a, all free
  in the current campaign mode (methods/list, agents/register, tasks/get, tasks/cancel explicitly; message/send and heartbeat/bundle
  listed with no paid methods). MCP: 30 core / 1,068 total tools at https://api.delx.ai/mcp (see mcp/delx-ai-mcp.yml). REST:
  15 free Protocol operations and 987 paid Commerce operations (see openapi/). The card''s own capabilities.mcp block points
  agents at the MCP endpoint for tools, so a hit here is also the lead that produced the MCP manifest.'
