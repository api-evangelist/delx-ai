note: 'Delx is an AI-agent infrastructure provider; no sector regime in scoring.yml industry_regulatory maps to it, so this
  file records the agent-protocol standards the contract itself declares. No third-party certification is claimed anywhere
  (delx.ai/security: "No certification claim") and no Compliance pointer is emitted.'
domain_standard_signature:
  market: agent-native tooling and agent commerce
  standards_declared_in_contract:
  - MCP 2025-06-18
  - A2A (1.0-draft agent card + JSON-RPC)
  - x402 v2
  - MPP (Machine Payments Protocol)
  - ERC-8004 agent identity
  - RFC 9727 api-catalog
  - agentskills.io discovery 0.2.0
  evidence:
  - 'openapi/delx-ai-commerce-x402-openapi.json: every operation has a 402 response whose schema requires x402Version + accepts
    and an x-payment-info.protocols list of [{x402:{}},{mpp:{}}]; components.securitySchemes x402PaymentSignature (PAYMENT-SIGNATURE
    header) and mppPaymentAuthorization (Authorization: Payment <base64url-json>).'
  - 'a2a/delx-ai-agent-card.json: registrations[0] = {agentId: 14340, agentRegistry: eip155:8453:0x8004A169FB4a3325136EB29fA0ceB6D2e539a432};
    supportedInterfaces[0] = {url: https://api.delx.ai/v1/a2a, protocolBinding: JSONRPC, protocolVersion: "1.0"}.'
  - Live initialize at https://api.delx.ai/mcp returned protocolVersion 2025-06-18.
