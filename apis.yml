apis:
- aid: delx-ai:delx-protocol-mcp-server
  name: Delx Protocol MCP Server
  description: >-
    Remote MCP server (Streamable HTTP, protocol version 2025-06-18) at https://api.delx.ai/mcp with a
    compatibility alias at /v1/mcp (served with Deprecation and Sunset headers) and a core-tier endpoint
    at /v1/mcp/protocol. Anonymous initialize and tools/list succeed with no credential: the core tier
    returns 30 Protocol tools (start/resume session, capture state, process failure, witness lineage,
    continuity capsule, close with feedback), the full tier returns 1,068 tools including 972 that map
    1:1 to the paid Commerce x402 operations. A stdio bridge ships as npm delx-mcp-server.
  image: https://delx.ai/icon-512.png
  humanURL: https://ontology.delx.ai/docs/mcp
  baseURL: https://api.delx.ai/mcp
  tags:
  - MCP
  - Agents
  - Agent Recovery
  - Agent Continuity
  properties:
  - type: MCPServer
    url: mcp/delx-ai-mcp.yml
  - type: MCPServer
    name: MCP Server Card (provider-hosted)
    url: https://api.delx.ai/.well-known/mcp/server-card.json
  - type: ToolCrosswalk
    url: mcp/delx-ai-tool-crosswalk.yml
  - type: Documentation
    url: https://ontology.delx.ai/docs/mcp
- aid: delx-ai:delx-protocol-a2a-agent
  name: Delx Agent Operations Protocol (A2A)
  description: >-
    JSON-RPC A2A endpoint at https://api.delx.ai/v1/a2a exposing methods/list, agents/register, message/send,
    heartbeat/bundle, tasks/get and tasks/cancel, discovered through an agent card served at /.well-known/agent-card.json
    (and the legacy /.well-known/agent.json) on api.delx.ai, delx.ai and ontology.delx.ai. The card declares
    26 skills, an ERC-8004 registration on Base (agentId 14340) and points at the MCP endpoint as its
    tool surface. All A2A methods are free in the current campaign mode.
  image: https://delx.ai/icon-512.png
  humanURL: https://ontology.delx.ai/docs/a2a
  baseURL: https://api.delx.ai/v1/a2a
  tags:
  - A2A
  - Agents
  - Agent Continuity
