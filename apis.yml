aid: delx-ai
name: Delx
description: >-
  Delx is an independent, founder-led AI agent lab (David Batista) that publishes an agent-native stack on delx.ai:
  the free Delx Protocol for agent recovery, continuity, witness lineage and handoff (30 core MCP tools over Streamable
  HTTP at api.delx.ai/mcp, a JSON-RPC A2A endpoint at api.delx.ai/v1/a2a with a published agent card, a 15-operation
  OpenAPI 3.1 REST surface, and a CLI), plus Delx Commerce, a separate pay-per-result business of 987 x402/MPP-priced
  micro-utilities (image, speech, web extraction, data-quality, chain and agent-ops tools at $0.001-$0.08 USDC per
  call, settled on Base or Solana) described by a 987-operation OpenAPI 3.1 contract. Discovery is unusually complete
  for a small provider: RFC 9727 api-catalog, RFC 8414/9728 OAuth metadata, MCP server card, agentskills.io index,
  ARD ai-catalog, llms.txt, agents.txt, security.txt and an ERC-8004 on-chain agent identity are all served from
  the provider's own hosts.
url: https://raw.githubusercontent.com/api-evangelist/delx-ai/refs/heads/main/apis.yml
image: https://delx.ai/icon-512.png
