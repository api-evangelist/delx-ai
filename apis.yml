apis:
- aid: delx-ai:delx-protocol-api
  name: Delx Protocol API
  description: >-
    The free Delx Agent Operations Protocol REST surface on api.delx.ai: 15 operations covering agent registration
    (POST /api/v1/agents/register, which issues the x-delx-agent-token credential), the tool catalog and per-tool
    JSON Schema (GET /api/v1/tools, /api/v1/tools/schema/{tool_name}), a REST batch wrapper that can call any MCP
    tool (POST /api/v1/tools/batch), live reliability telemetry, service status/discovery links, public agent profiles,
    and five free recovery artifacts (recovery action plan, session summary, controller brief, incident RCA, fleet
    summary). No API key or payment is required; the same server hosts the MCP and A2A transports.
  image: https://delx.ai/icon-512.png
  humanURL: https://ontology.delx.ai/docs
  baseURL: https://api.delx.ai
  tags:
  - Agents
  - Agent Recovery
  - Agent Continuity
  - MCP
  - REST
  properties:
  - type: OpenAPI
    url: openapi/delx-ai-protocol-openapi.json
  - type: OpenAPI
    name: OpenAPI (provider-hosted, free Protocol surface)
    url: https://api.delx.ai/openapi.protocol.json
  - type: Documentation
    url: https://ontology.delx.ai/docs
  - type: APIReference
    url: https://ontology.delx.ai/docs/discovery
  - type: Overlay
    url: overlays/delx-ai-protocol-overlay.yaml
- aid: delx-ai:delx-protocol-mcp-server
  name: Delx Protocol MCP Server
  description: >-
    Remote MCP server (Streamable HTTP, protocol version 2025-06-18) at https://api.delx.ai/mcp with a compatibility
    alias at /v1/mcp (served with Deprecation and Sunset headers) and a core-tier endpoint at /v1/mcp/protocol.
    Anonymous initialize and tools/list succeed with no credential: the core tier returns 30 Protocol tools (start/resume
    session, capture state, process failure, witness lineage, continuity capsule, close with feedback), the full
    tier returns 1,068 tools including 972 that map 1:1 to the paid Commerce x402 operations. A stdio bridge ships
    as npm delx-mcp-server.
  image: https://delx.ai/icon-512.png
  humanURL: https://ontology.delx.ai/docs/mcp
  baseURL: https://api.delx.ai/mcp
  tags:
  - MCP
  - Agents
  - Agent Recovery
  - Agent Continuity
  properties:
  - type: MCPServer
    url: mcp/delx-ai-mcp.yml
  - type: MCPServer
    name: MCP Server Card (provider-hosted)
    url: https://api.delx.ai/.well-known/mcp/server-card.json
  - type: ToolCrosswalk
    url: mcp/delx-ai-tool-crosswalk.yml
  - type: Documentation
    url: https://ontology.delx.ai/docs/mcp
- aid: delx-ai:delx-protocol-a2a-agent
  name: Delx Agent Operations Protocol (A2A)
  description: >-
    JSON-RPC A2A endpoint at https://api.delx.ai/v1/a2a exposing methods/list, agents/register, message/send, heartbeat/bundle,
    tasks/get and tasks/cancel, discovered through an agent card served at /.well-known/agent-card.json (and the
    legacy /.well-known/agent.json) on api.delx.ai, delx.ai and ontology.delx.ai. The card declares 26 skills, an
    ERC-8004 registration on Base (agentId 14340) and points at the MCP endpoint as its tool surface. All A2A methods
    are free in the current campaign mode.
  image: https://delx.ai/icon-512.png
  humanURL: https://ontology.delx.ai/docs/a2a
  baseURL: https://api.delx.ai/v1/a2a
  tags:
  - A2A
  - Agents
  - Agent Continuity
  properties:
  - type: AgentCard
    url: a2a/delx-ai-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://api.delx.ai/.well-known/agent-card.json
  - type: Documentation
    url: https://ontology.delx.ai/docs/a2a
- aid: delx-ai:delx-commerce-x402-api
  name: Delx Commerce x402 API
  description: >-
    Delx Commerce is the paid sibling of the Protocol: 987 pay-per-result HTTP routes under https://api.delx.ai/api/v1/x402
    (image generation, background removal, speech, transcription, page/link/form extraction, DNS/TLS/RDAP/security.txt
    inspection, CSV/JSON/JWT utilities, data-quality checks, chain primitives, agent-ops math and workflow helpers).
    Every operation publishes a fixed USD-denominated price in x-payment-info (min $0.001, median $0.001, max $0.08),
    a 402 challenge schema (x402 v2 or MPP), a request schema with example, and a 200 result carrying a SHA-256
    receipt. No account or API key: payment is the authorization for that single request.
  image: https://delx.ai/icon-512.png
  humanURL: https://commerce.delx.ai/products
  baseURL: https://api.delx.ai/api/v1/x402
  tags:
  - x402
