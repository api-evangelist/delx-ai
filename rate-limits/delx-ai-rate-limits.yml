  limit: x-ratelimit-limit
  remaining: x-ratelimit-remaining
  reset: x-ratelimit-reset (seconds until reset)
  retryAfter: retry-after (exposed via Access-Control-Expose-Headers; not observed on a 2xx)
  requestId: x-delx-request-id
responseCodes:
  throttled: 429
limits:
- name: Anonymous requests to api.delx.ai (observed)
  scope: unknown (per-IP or per-key not documented; observed on anonymous requests)
  metric: requests_per_window
  limit: 60
  window: reset counter observed at 21-23 s after four requests in one minute; window length not documented
  timeFrame: window
  observed:
    x-ratelimit-limit: '60'
    x-ratelimit-remaining: 45 -> 44 -> 43 across three consecutive tools/list calls
    x-ratelimit-reset: 23 -> 22 -> 21
    fetched: '2026-09-19'
    endpoint: https://api.delx.ai/mcp
policy:
  docs: https://ontology.delx.ai/legal/terms
  quote: The Service enforces rate limits to ensure fair access. Current limits are communicated via standard HTTP headers
    ( X-RateLimit-Limit , X-RateLimit-Remaining , X-RateLimit-Reset ). Agents that exceed rate limits will receive HTTP 429
    responses. Agents must implement exponential backoff when receiving 429s. Persistent abuse of rate limits may result in
    temporary or permanent IP-level blocking.
