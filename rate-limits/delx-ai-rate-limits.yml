description: 'Delx does not publish a numeric limit in its docs (the Terms say "Current limits are documented in the discovery
  documentation", and ontology.delx.ai/docs/rate-limits 404s). The runtime signal is complete, though: every api.delx.ai response
  carries x-ratelimit-limit, x-ratelimit-remaining and x-ratelimit-reset, and the Terms commit to 429 on exhaustion with mandatory
  exponential backoff and possible IP-level blocking for persistent abuse.'
limit_count: 1
