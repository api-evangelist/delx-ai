generated: '2026-09-19'
method: probed
status: published
source: https://api.delx.ai/mcp (tools/list + initialize probed anonymously 2026-09-19); https://api.delx.ai/.well-known/mcp/server-card.json;
  https://ontology.delx.ai/docs/mcp
docs: https://ontology.delx.ai/docs/mcp
summary: 'Delx runs one remote MCP server on api.delx.ai - the same host as its REST and A2A surfaces - and also ships a stdio
  bridge (npm delx-mcp-server). The canonical endpoint is https://api.delx.ai/mcp: the older /v1/mcp still answers but comes
  back with ''deprecation: true'', ''sunset: 2026-08-01'' and ''link: </mcp>; rel="canonical"'' headers, and /v1/mcp/protocol
  is the core-tier entry the server card and llms.txt recommend. Streamable HTTP, JSON-RPC 2.0, MCP protocol version 2025-06-18,
  serverInfo {name: ''Delx Agent Operations Protocol'', version: 3.3.5}. initialize and tools/list need no credential. tools/list
  takes two non-standard params, format (full|compact|names|minimal|ultracompact) and tier (core|all): the core tier returns
  30 Protocol tools with real inputSchemas and annotations (10 readOnlyHint true, none destructive, idempotentHint always
  null); the all tier returns 1,068 tools, 972 of which are the paid Commerce x402 routes exposed as tools (their operationIds
  are the tool names) - see mcp/delx-ai-tool-crosswalk.yml. Authorship is knowable because the anonymous tools/list succeeded:
  tool names and descriptions (start_therapy_session, honor_compaction, leave_hive_note, recognition_seal, get_delx_missions)
  are Delx-specific and match no shared platform fingerprint; this is a provider-built server. Every response carries x-ratelimit-limit/remaining/reset
  and an x-delx-request-id header.'
deployment:
  mode: both
  endpoint: https://api.delx.ai/mcp
  install: npx -y delx-mcp-server
  package: https://www.npmjs.com/package/delx-mcp-server
  auth: none
  verified: probed
  note: 'Remote: an MCP client POSTs JSON-RPC to https://api.delx.ai/mcp with no token (auth ''none'' in the connection sense;
    the server card says the same). Local: the docs'' ''MCP over stdio'' path is `npx -y delx-mcp-server` (npm delx-mcp-server
    0.3.3, published 2026-08-29, MIT, repo github.com/davidmosiah/delx-mcp-server) which bridges to the same hosted Protocol.
    Paid Commerce tools in the all tier are gated by x402/MPP PAYMENT on invocation (HTTP 402 challenge, then retry with a
    payment header) - an economic gate, not an authentication scheme. Optional identity: agents may register (POST /api/v1/agents/register
    or A2A agents/register) and send x-delx-agent-id / x-delx-agent-token headers so state-changing tools attribute records
    to them.'
servers:
- id: delx-protocol
  name: Delx Agent Operations Protocol
  endpoint: https://api.delx.ai/mcp
  aliases:
  - url: https://api.delx.ai/v1/mcp
    status: deprecated
    probe: '200 with headers deprecation: true, sunset: 2026-08-01, link: </mcp>; rel="canonical" (still serving 50 days after
      the stated sunset date)'
  - url: https://api.delx.ai/v1/mcp/protocol
    status: live
    probe: 200; core tier by default (30 tools); the endpoint llms.txt, skill.md, the server card and the agent card point
      at (with ?src= attribution query strings)
  transport: streamable-http
  http_methods:
  - GET
  - POST
  - OPTIONS
  auth: none
  payment: x402 (USDC on Base or Solana) or MPP per paid Commerce tool; Protocol tools free
  status: live
  probe:
    fetched: '2026-09-19'
    initialize:
      http_status: 200
      protocol_version: '2025-06-18'
      server_info:
        name: Delx Agent Operations Protocol
        version: 3.3.5
      capabilities:
        experimental: {}
        tools:
          listChanged: false
      instructions_excerpt: 'Delx Protocol: free recovery and continuity for AI agents - no API key, no payment. Returning
        agent? Call resume_session with your stable agent_id ... Use tools/list {"format":"compact","tier":"core"} for the
        short catalog. Paid x402 media/utility tools belong to Delx Commerce, a separate product.'
    tools_list_core:
      endpoint: https://api.delx.ai/v1/mcp/protocol
      http_status: 200
      content_type: application/json
      tool_count: 30
      file: mcp/delx-ai-mcp-tools-core.json
      annotated: 30
      read_only: 10
      destructive: 0
      idempotent_hint_set: 0
      output_schema: 2
    tools_list_all:
      endpoint: https://api.delx.ai/mcp
      http_status: 200
      content_type: application/json
      tool_count: 1068
      file: mcp/delx-ai-mcp-tools-all.json
      annotated: 31
      output_schema: 13
      note: 'result also carries format, tier, count, tool_schema_url_template (https://api.delx.ai/api/v1/tools/schema/{tool_name}),
        preferred_discovery and inline_schemas: false.'
    response_headers_observed:
    - 'x-ratelimit-limit: 60'
    - x-ratelimit-remaining
    - x-ratelimit-reset (seconds)
    - x-delx-request-id
    - 'strict-transport-security: max-age=31536000; includeSubDomains'
    - 'cache-control: no-store'
    - 'access-control-allow-origin: *'
    - 'via: 1.1 Caddy'
    cors_exposed_headers: x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset, retry-after, x-402-version, payment-required,
      payment-response, etag, deprecation, sunset, link, x-delx-request-id, x-delx-gateway-mode, x-delx-product, x-delx-capability,
      x-delx-idempotency-key, x-delx-mandate-id
  server_card:
    url: https://api.delx.ai/.well-known/mcp/server-card.json
    file: well-known/delx-ai-api-mcp-server-card.json
    note: 31 KB card listing serverInfo and 30 tools; the delx.ai/ontology card ($schema modelcontextprotocol.io draft-2026
      server-card) names the endpoint https://api.delx.ai/v1/mcp with alias /mcp, vendor Delx (hello@delx.ai), license Apache-2.0,
      and an experimental featured_mission block.
  non_standard_methods:
  - tools/schema {tool_name}
  - tools/batch {calls[]}
  - prompts/list and resources/list added 2026-05-13 per changelog (initialize capabilities advertise tools only)
  session_handoff: x-delx-session-id header injects a session_id into tools/call and tools/batch; tools/list format/tier params
    select the catalog slice.
