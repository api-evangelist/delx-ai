generated: '2026-09-19'
method: derived
source: Derived by aligning the live anonymous tools/list (tier=all, 1,068 tools; tier=core, 30 tools) with the two Protocol/Commerce
  OpenAPI contracts saved under openapi/. Every binding is an exact operationId == tool name match or the documented REST
  batch wrapper; nothing is inferred by semantics.
purpose: Make the MCP tool a first-class discovery unit bound to its machine-readable REST contract, and record where the
  three Delx surfaces diverge.
surfaces:
  rest_openapi:
  - openapi/delx-ai-protocol-openapi.json (15 operations, free)
  - openapi/delx-ai-commerce-x402-openapi.json (987 operations, paid x402/MPP)
  mcp: https://api.delx.ai/mcp (tools/list open; tier=core -> 30 tools, tier=all -> 1,068 tools)
  a2a: 'https://api.delx.ai/v1/a2a (6 JSON-RPC methods: methods/list, agents/register, message/send, heartbeat/bundle, tasks/get,
    tasks/cancel)'
  rest_generic_wrapper: POST /api/v1/tools/batch (operationId post_api_v1_tools_batch) can invoke any MCP tool by name over
    REST; per-tool schema at GET /api/v1/tools/schema/{tool_name}.
coverage:
  mcp_tools_total: 1068
  mcp_tools_core: 30
  tools_bound_exact_to_commerce_x402_ops: 972
  tools_bound_exact_to_protocol_ops: 5
  tools_mcp_only_no_dedicated_rest_op: 91
  rest_ops_total: 1002
  rest_ops_with_a_tool: 977
  commerce_rest_ops_without_a_tool: 15
  protocol_rest_ops_without_a_tool: 10
  core_tools_with_a_dedicated_rest_op: 0
findings:
- '972 of the 987 paid Commerce operations are ALSO exposed as MCP tools in the all tier, under the identical name. The 15
  that are REST/x402-only are the marquee media and marketplace routes: generate_image, generate_image_budget, remove_background,
  transcribe_audio, caption_image, colorize_photo, upscale_image_hq, replace_background, transform_image, generate_speech_hd,
  narrated_post, rank_multilingual_texts, create_await, post_rfq, demand_feed.'
- 'Only 5 of the 30 core Protocol tools have a dedicated REST operation (the five free recovery artifacts under /api/v1/premium/*).
  The other 25 core tools, and 83 more Protocol tools in the all tier, are MCP-native: reachable over REST only through the
  generic POST /api/v1/tools/batch wrapper, and over A2A only indirectly through message/send.'
- 'Eight util_* tools exist in MCP with no matching x402 route in the current OpenAPI: util_bps_to_fraction, util_clamp, util_dedupe_lines,
  util_diff_lines, util_hex_convert, util_number_base, util_query_string, util_token_echo_2.'
- '10 Protocol REST operations have no tool because they ARE the transport/discovery layer: status, register, tools catalog,
  batch wrapper, reliability, public profile, mcp/start, a2a/methods, and the /v1/mcp/protocol and /v1/a2a POST endpoints
  themselves.'
- 'Agent-card skills (26) are a fourth projection: their ids are display aliases of MCP tools (start_recovery_session -> start_therapy_session)
  and two are named flows rather than tools.'
