description: 'Delx has no subscription, no seats and no SLA table. The Protocol, Agents Hive and A2A are free with no account
  or key ("A paywall at failure would contradict a published refusal"). Delx Commerce charges per delivered result: each of
  the 987 routes publishes an exact USD-denominated price in its OpenAPI x-payment-info, paid as USDC on Base or Solana through
  an HTTP 402 x402 challenge (or MPP). Security reviews are scoped engagements without a list price.'
plan_count: 3
currency: USD (settled as USDC)
billing: per request (pay-per-result); no monthly plan
