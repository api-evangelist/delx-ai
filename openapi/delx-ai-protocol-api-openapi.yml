                  closure_reason: 'success criteria: outcome=success'
                  pending_outcomes: 0
                  incident_profile:
                    type: loop_detected
                    severity: high
                    root_cause: missing_exit_condition
                  latest_outcome:
                    outcome: success
                    notes: Loop broken and deploy stabilized.
                    metrics:
                      errors_delta: -14
                  next_tools:
