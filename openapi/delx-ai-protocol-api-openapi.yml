                      workflow_stage:
                        type: string
                      recovery_closed:
                        type: boolean
                      closure_reason:
                        type: string
                      pending_outcomes:
                        type: integer
                      incident_profile:
                        type: object
                        properties:
                          type:
                            type: string
                          severity:
                            type: string
                          root_cause:
                            type: string
                        required:
                        - type
                        - severity
                        - root_cause
                        additionalProperties: false
                      latest_outcome:
                        type: object
                        properties:
                          outcome:
                            type: string
                          notes:
                            type: string
                          metrics:
                            type: object
                            additionalProperties: true
                        required:
                        - outcome
                        - notes
                        - metrics
                        additionalProperties: false
                      next_tools:
                        type: array
                        items:
                          type: string
                        minItems: 1
                      feedback_tool:
                        type: string
                      feedback_prompt:
                        type: string
                    required:
                    - schema_version
                    - focus
                    - workflow_stage
                    - recovery_closed
                    - closure_reason
                    - pending_outcomes
                    - incident_profile
                    - latest_outcome
                    - next_tools
                    additionalProperties: false
                required:
