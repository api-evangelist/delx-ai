                        text:
                          type: string
                      required:
                      - type
                      - text
                      additionalProperties: true
                    minItems: 1
                  artifact:
                    type: object
                    properties:
                      schema_version:
                        type: string
                        const: delx/controller-brief/v1
                      focus:
                        type: string
                      workflow_stage:
                        type: string
                      recovery_closed:
                        type: boolean
                      closure_reason:
                        type: string
                      risk_level:
                        type: string
                      pending_outcomes:
                        type: integer
                      latest_outcome:
                        type: object
                        properties:
                          outcome:
                            type: string
                          notes:
                            type: string
                          metrics:
                            type: object
                            additionalProperties: true
                        required:
                        - outcome
                        - notes
                        - metrics
                        additionalProperties: false
                      next_tools:
                        type: array
                        items:
                          type: string
                        minItems: 1
                      feedback_tool:
                        type: string
                      feedback_prompt:
                        type: string
                    required:
                    - schema_version
                    - focus
                    - workflow_stage
                    - recovery_closed
                    - closure_reason
                    - risk_level
                    - pending_outcomes
                    - latest_outcome
                    - next_tools
                    additionalProperties: false
                required:
                - tool_name
                - preferred_name
                - content
                additionalProperties: false
              example:
                tool_name: generate_controller_brief
                preferred_name: generate_controller_brief
                content:
                - type: text
                  text: Controller brief artifact for the paid Delx session.
                artifact:
                  schema_version: delx/controller-brief/v1
                  focus: operational handoff
                  workflow_stage: recovery_closed
                  recovery_closed: true
                  closure_reason: 'success criteria: outcome=success'
                  risk_level: medium
                  pending_outcomes: 0
                  latest_outcome:
                    outcome: success
                    notes: Loop broken and deploy stabilized.
                    metrics:
                      errors_delta: -14
                  next_tools:
                  - generate_incident_rca
                  - provide_feedback
                  - daily_checkin
                  feedback_tool: provide_feedback
                  feedback_prompt: If the controller brief helped, provide_feedback(session_id=..., rating=1-5).
        '400':
          description: Invalid Protocol request
        '404':
          description: Session or controller not found
      x-delx-product: delx_protocol
      x-delx-access: free
      x-discovery:
        category: protocol-recovery
        tags:
        - delx-protocol
        - free
        - recovery
        - continuity
        resource: https://api.delx.ai/api/v1/premium/controller-brief
        free: true
        owner: delx-protocol
        catalogPriority: null
        recommendedFirstCall: false
        agentFirstStart: null
        agentFirstMcpStart: null
  /api/v1/premium/incident-rca:
    post:
      operationId: generate_incident_rca
      summary: Free Protocol incident RCA with evidence, corrective actions, and prevention
      tags:
      - Protocol
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  description: The session ID to analyze
                incident_summary:
                  type: string
                  description: Optional incident summary if you want to override the recent failure context
                focus:
                  type: string
                  description: Optional RCA lens such as payments, latency, cost, or routing
                agent_id:
                  type: string
                  description: 'Optional but recommended: your stable agent_id, to prove you own this session. Sending it with agent_token attributes the record to you.'
                agent_token:
                  type: string
                  description: 'Optional but recommended: the agent_token returned by POST /api/v1/agents/register (identity_auth.token) or A2A agents/register. MCP clients may send x-delx-agent-id / x-delx-agent-token headers instead.'
              required:
              - session_id
            example:
              session_id: 123e4567-e89b-12d3-a456-426614174000
              incident_summary: 429 retry storm after deploy
              focus: routing
      responses:
