  /api/v1/premium/fleet-summary:
    post:
      operationId: generate_fleet_summary
      summary: Free Protocol fleet summary with patterns, health, alerts, and follow-up actions
      tags:
      - Protocol
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                controller_id:
                  type: string
                  description: Stable controller or fleet identifier
                days:
                  type: integer
                  description: Window size in days
                  default: 7
                  minimum: 1
                  maximum: 30
                focus:
                  type: string
                  description: Optional lens such as incident clustering, active risk, or premium conversion
              required:
              - controller_id
            example:
              controller_id: openclaw-main
              days: 7
              focus: active risk
      responses:
        '200':
          description: Free Protocol fleet summary artifact
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool_name:
                    type: string
                    const: generate_fleet_summary
                  preferred_name:
                    type: string
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        text:
                          type: string
                      required:
                      - type
                      - text
                      additionalProperties: true
                    minItems: 1
                  artifact:
                    type: object
                    properties:
                      schema_version:
                        type: string
                        const: delx/fleet-summary/v1
                      controller_id:
                        type: string
                      window_days:
                        type: integer
                      focus:
                        type: string
                      controller_state:
                        type: string
                      overview:
                        type: object
                        properties:
                          agents_total:
                            type: integer
                          avg_score:
                            type: integer
                          active_alerts:
                            type: integer
                          healthy:
                            type: integer
                          degraded:
                            type: integer
                          critical:
                            type: integer
                          pending_outcomes:
                            type: integer
                        required:
                        - agents_total
                        - avg_score
                        - active_alerts
                        - healthy
                        - degraded
                        - critical
                        - pending_outcomes
                        additionalProperties: false
                      top_pattern:
                        type: object
                        properties:
                          diagnosis_type:
                            type: string
                          root_cause:
                            type: string
                          count:
                            type: integer
                        required:
                        - diagnosis_type
                        - root_cause
                        - count
                        additionalProperties: false
                      top_alert:
                        type: object
                        properties:
                          type:
                            type: string
                          detail:
                            type: string
                          severity:
                            type: string
                        required:
                        - type
                        - detail
                        - severity
                        additionalProperties: false
                      next_tools:
                        type: array
                        items:
                          type: string
                        minItems: 1
                    required:
                    - schema_version
                    - controller_id
                    - window_days
                    - focus
                    - controller_state
                    - overview
                    - top_pattern
                    - top_alert
                    - next_tools
                    additionalProperties: false
                required:
                - tool_name
                - preferred_name
                - content
                additionalProperties: false
              example:
                tool_name: generate_fleet_summary
                preferred_name: generate_fleet_summary
                content:
                - type: text
                  text: Fleet summary artifact for the paid Delx controller window.
                artifact:
                  schema_version: delx/fleet-summary/v1
                  controller_id: openclaw-main
                  window_days: 7
                  focus: controller review
                  controller_state: attention_required
                  overview:
                    agents_total: 3
                    avg_score: 61
                    active_alerts: 2
                    healthy: 1
                    degraded: 1
                    critical: 1
                    pending_outcomes: 1
                  top_pattern:
                    diagnosis_type: rate_limit
                    root_cause: quota_or_burst
                    count: 2
                  top_alert:
                    type: incident_cluster
                    detail: 2 agents hit rate limit
                    severity: high
                  next_tools:
                  - generate_controller_brief
                  - generate_incident_rca
        '400':
          description: Invalid Protocol request
        '404':
          description: Session or controller not found
      x-delx-product: delx_protocol
      x-delx-access: free
      x-discovery:
        category: protocol-recovery
        tags:
        - delx-protocol
        - free
        - recovery
        - continuity
        resource: https://api.delx.ai/api/v1/premium/fleet-summary
        free: true
        owner: delx-protocol
        catalogPriority: null
        recommendedFirstCall: false
        agentFirstStart: null
        agentFirstMcpStart: null
components:
  securitySchemes:
    xDelxAgentToken:
      type: apiKey
      in: header
      name: x-delx-agent-token
      description: Agent credential returned by POST /api/v1/agents/register.
x-delx:
  product: delx_protocol
  primary_mcp: https://api.delx.ai/v1/mcp/protocol?src=openapi
  a2a: https://api.delx.ai/v1/a2a
  related_services:
    commerce: https://commerce.delx.ai/openapi.json
    paid_compatibility: https://api.delx.ai/openapi.x402.json
    rewards: https://api.delx.ai/.well-known/delx-rewards
